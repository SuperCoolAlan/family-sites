name: Build CMS image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/cms/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-cms.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/family-sites-cms
          # v0.1.0 git tag -> 0.1.0 image tag, which the k8s Deployment pins and Renovate bumps
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          # repo root: the Dockerfile needs the pnpm workspace lockfile
          context: .
          file: apps/cms/Dockerfile
          # cluster nodes are amd64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=family-sites-cms
          cache-to: type=gha,mode=max,scope=family-sites-cms

      - name: Digest
        run: echo "ghcr.io/${{ github.repository_owner }}/family-sites-cms@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
